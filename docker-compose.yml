services:
  postgresql:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: resend_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgresql_data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/resend-attachments
      "

  app:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/resend_test
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_v2_API_KEY: ${EMAIL_v2_API_KEY:-}
      EMAIL_V2_API_KEY: ${EMAIL_V2_API_KEY:-}
      OUTBOX_DRAIN_API_KEY: ${OUTBOX_DRAIN_API_KEY:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      ATTACHMENTS_ENABLED: ${ATTACHMENTS_ENABLED:-}
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-resend-attachments}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-us-east-1}
      ATTACHMENTS_S3_ENDPOINT: ${ATTACHMENTS_S3_ENDPOINT:-http://minio:9000}
      ATTACHMENTS_S3_FORCE_PATH_STYLE: ${ATTACHMENTS_S3_FORCE_PATH_STYLE:-true}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID:-minioadmin}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      - postgresql
      - minio

volumes:
  postgresql_data:
  minio_data:
