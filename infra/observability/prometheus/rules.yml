groups:
  - name: resend-conversation-service
    rules:
      - alert: ResendConversationServiceTelemetryMissing
        expr: absent_over_time(resend_conversation_runtime_info{service_name="resend-conversation-service"}[10m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Resend conversation service has not exported metrics.

      - alert: ResendConversationServiceHttpErrors
        expr: |
          sum by (service_name, deployment_environment_name, service_group, vcs_revision) (
            rate(http_server_request_count_total{service_name="resend-conversation-service",http_response_status_code=~"5.."}[5m])
          )
          /
          sum by (service_name, deployment_environment_name, service_group, vcs_revision) (
            rate(http_server_request_count_total{service_name="resend-conversation-service"}[5m])
          ) > 0.05
          and
          sum by (service_name, deployment_environment_name, service_group, vcs_revision) (
            rate(http_server_request_count_total{service_name="resend-conversation-service"}[5m])
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Resend conversation service HTTP 5xx rate exceeds five percent.

      - alert: ResendConversationServiceOutboxStalled
        expr: resend_conversation_outbox_oldest_pending_age_seconds{service_name="resend-conversation-service"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Resend conversation service has pending outbox work older than ten minutes.

      - alert: ResendConversationServiceOutboxIndeterminate
        expr: increase(resend_conversation_outbox_message_count_total{service_name="resend-conversation-service",outcome="indeterminate"}[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Resend conversation service has indeterminate outbox messages.

      - alert: ResendConversationServiceNatsDeliveryStalled
        expr: resend_conversation_conversation_event_delivery_oldest_pending_age_seconds{service_name="resend-conversation-service",sink="nats"} > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Resend conversation event delivery has been pending for more than five minutes.
