name: Migrate Docker Hub Images

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type COPY-HISTORICAL-IMAGES to copy all source tags.
        required: true
        type: string

concurrency:
  group: docker-image-migration
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_IMAGE: castab/resend-service
  TARGET_IMAGE: castab/resend-conversation-service

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Confirm migration
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "COPY-HISTORICAL-IMAGES"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3

      - name: Copy source tags and verify manifest digests
        run: |
          export PATH="$HOME/go/bin:$PATH"
          crane ls "$SOURCE_IMAGE" > source-tags.txt
          test -s source-tags.txt
          while IFS= read -r tag; do
            crane copy "$SOURCE_IMAGE:$tag" "$TARGET_IMAGE:$tag"
            test "$(crane digest "$SOURCE_IMAGE:$tag")" = "$(crane digest "$TARGET_IMAGE:$tag")"
          done < source-tags.txt
