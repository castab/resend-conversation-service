name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_DB: resend_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: bitnami/minio:2025
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: resend-attachments
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -sf http://localhost:9000/minio/health/live"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup test databases
        run: npm run db:setup
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test

      - name: Validate
        run: |
          npm run release:validate
          npm run db:validate
          npm run api:validate
          npm run lint
          npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Start application
        run: |
          npm run start > app.log 2>&1 &
        env:
          RESEND_WEBHOOK_SECRET: whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ=
          RESEND_API_KEY: test-resend-api-key
          RESEND_API_BASE_URL: http://localhost:4010
          RESEND_REPLY_TO: mailbox@replies.example.com
          EMAIL_V2_API_KEY: test-conversation-v2-api-key
          OUTBOX_DRAIN_API_KEY: test-outbox-drain-api-key
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test

      - name: Wait for application
        run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:3000/api/health/v2 && break
            sleep 1
          done
          curl --fail --silent http://localhost:3000/api/health/v2 > /dev/null || (cat app.log && exit 1)

      - name: Run tests
        run: npm run test:postgresql
        env:
          RESEND_WEBHOOK_SECRET: whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ=
          RESEND_API_KEY: test-resend-api-key
          RESEND_API_BASE_URL: http://localhost:4010
          RESEND_REPLY_TO: mailbox@replies.example.com
          EMAIL_V2_API_KEY: test-conversation-v2-api-key
          OUTBOX_DRAIN_API_KEY: test-outbox-drain-api-key
          APP_BASE_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test

      - name: Start application with attachments enabled
        run: |
          PORT=3001 npm run start > app-attachments.log 2>&1 &
        env:
          RESEND_WEBHOOK_SECRET: whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ=
          RESEND_API_KEY: test-resend-api-key
          RESEND_API_BASE_URL: http://localhost:4011
          RESEND_REPLY_TO: mailbox@replies.example.com
          EMAIL_V2_API_KEY: test-conversation-v2-api-key
          OUTBOX_DRAIN_API_KEY: test-outbox-drain-api-key
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test
          ATTACHMENTS_ENABLED: "true"
          ATTACHMENTS_S3_BUCKET: resend-attachments
          ATTACHMENTS_S3_REGION: us-east-1
          ATTACHMENTS_S3_ENDPOINT: http://localhost:9000
          ATTACHMENTS_S3_FORCE_PATH_STYLE: "true"
          ATTACHMENTS_S3_ACCESS_KEY_ID: minioadmin
          ATTACHMENTS_S3_SECRET_ACCESS_KEY: minioadmin

      - name: Wait for the attachments application
        run: |
          for i in {1..30}; do
            curl --fail --silent http://localhost:3001/api/health/v2 && break
            sleep 1
          done
          curl --fail --silent http://localhost:3001/api/health/v2 > /dev/null || (cat app-attachments.log && exit 1)

      - name: Run attachment tests
        run: npm run test:postgresql:attachments
        env:
          RESEND_WEBHOOK_SECRET: whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ=
          RESEND_API_KEY: test-resend-api-key
          RESEND_API_BASE_URL: http://localhost:4011
          RESEND_REPLY_TO: mailbox@replies.example.com
          EMAIL_V2_API_KEY: test-conversation-v2-api-key
          OUTBOX_DRAIN_API_KEY: test-outbox-drain-api-key
          APP_BASE_URL: http://localhost:3001
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test
          ATTACHMENTS_ENABLED: "true"

      - name: Assert attachments fail startup without storage credentials
        run: |
          set +e
          ATTACHMENTS_ENABLED=true node scripts/validate-runtime-env.mjs > env-check.log 2>&1
          status=$?
          set -e
          test "$status" != "0" || (echo "expected a nonzero exit" && exit 1)
          grep -q runtime_attachments_configuration_missing env-check.log
          ! grep -qi secret env-check.log
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/resend_test
          RESEND_API_KEY: test-resend-api-key
          RESEND_WEBHOOK_SECRET: whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ=
          RESEND_REPLY_TO: mailbox@replies.example.com
          EMAIL_V2_API_KEY: test-conversation-v2-api-key
          OUTBOX_DRAIN_API_KEY: test-outbox-drain-api-key

      - name: Build production image
        run: docker build -t resend-conversation-service:test .

      - name: Smoke test production image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/resend_test \
            resend-conversation-service:test npm run db:migrate:deploy
          docker run -d --name resend-conversation-service-smoke --network host \
            -e PORT=3100 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/resend_test \
            -e RESEND_API_KEY=test-resend-api-key \
            -e RESEND_WEBHOOK_SECRET=whsec_dGVzdF9zZWNyZXRfa2V5X2Zvcl90ZXN0aW5nXzEyMzQ= \
            -e RESEND_REPLY_TO=mailbox@replies.example.com \
            -e EMAIL_V2_API_KEY=test-conversation-v2-api-key \
            -e OUTBOX_DRAIN_API_KEY=test-outbox-drain-api-key \
            resend-conversation-service:test
          for i in {1..30}; do
            curl --fail --silent http://localhost:3100/api/health/v2 && break
            sleep 1
          done
          curl --fail --silent http://localhost:3100/api/health/v2 > /dev/null || (docker logs resend-conversation-service-smoke && exit 1)
          curl --fail --silent http://localhost:3100/openapi.json > /dev/null
          curl --fail --silent http://localhost:3100/asyncapi.json > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3100/api/health/v1)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3100/api/conversations/v2?assignment=unassigned)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3100/api/conversations/v1?assignment=unassigned)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3100/api/attachments/v2/00000000-0000-7000-8000-00000000beef)" = "404"
          docker rm -f resend-conversation-service-smoke
